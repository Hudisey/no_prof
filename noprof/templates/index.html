<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoProf - Giris</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center h-screen font-mono">
    <div class="w-full max-w-sm p-8 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl">
        <h1 class="text-2xl font-bold tracking-wider text-center mb-6 text-white">NOPROF</h1>
        
        {% if error %}
            <div class="mb-4 p-3 bg-red-950/50 border border-red-800 text-red-200 text-sm rounded text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-zinc-400 mb-1">KULLANICI ADI</label>
                <input type="text" name="username" required autocomplete="off"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-500">
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1">SIFRE</label>
                <input type="password" name="password" required
                    class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-500">
            </div>
            <button type="submit" 
                class="w-full bg-zinc-100 text-zinc-950 font-bold py-2 rounded hover:bg-white transition">
                GIRIS YAP / BASLA
            </button>
        </form>
    </div>
</body>
</html>
