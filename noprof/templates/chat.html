<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoProf - Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col font-mono">
    <header class="border-b border-zinc-800 p-4 flex justify-between items-center bg-zinc-900/50">
        <div class="flex items-center space-x-3">
            <span class="font-bold tracking-widest text-white">NOPROF</span>
            <span class="text-xs text-zinc-500">| Odam: <span class="text-zinc-300">genel</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-zinc-400">@{{ username }}</span>
            <a href="/logout" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded transition">Cikis</a>
        </div>
    </header>

    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="text-center text-xs text-zinc-600 my-2">Sohbet basladi. Mesajlar herkesten silinebilir.</div>
    </div>

    <div class="border-t border-zinc-800 p-4 bg-zinc-900/50">
        <form id="chatForm" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="messageInput" autocomplete="off" placeholder="Mesaj yaz..." 
                class="flex-1 bg-zinc-950 border border-zinc-800 rounded px-4 py-2 text-zinc-100 focus:outline-none focus:border-zinc-500">
            <button type="submit" class="bg-zinc-100 text-zinc-950 font-bold px-6 py-2 rounded hover:bg-white transition">Gonder</button>
        </form>
    </div>

    <script>
        const socket = io();
        const username = "{{ username }}";
        const room = "genel";

        socket.emit('join', { room: room });

        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = messageInput.value.trim();
            if (!msg) return;

            const msg_id = 'msg_' + Math.random().toString(36).substr(2, 9);
            socket.emit('send_message', { room: room, msg_id: msg_id, message: msg });
            messageInput.value = '';
        });

        socket.addEventListener('receive_message', (data) => {
            const isMe = data.username === username;
            const div = document.createElement('div');
            div.id = data.msg_id;
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

            div.innerHTML = `
                <div class="text-[10px] text-zinc-500">${data.username}</div>
                <div class="max-w-xs md:max-w-md px-3 py-2 rounded-lg text-sm border ${isMe ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-zinc-900/40 border-zinc-800 text-zinc-300'} flex items-center justify-between gap-4">
                    <span>${data.message}</span>
                    <button onclick="deleteMessage('${data.msg_id}')" class="text-[10px] text-red-400 hover:text-red-300 uppercase tracking-tighter shrink-0 border border-red-950 bg-red-950/30 px-1.5 py-0.5 rounded">Sil</button>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function deleteMessage(msg_id) {
            socket.emit('delete_message', { room: room, msg_id: msg_id });
        }

        socket.addEventListener('remove_message', (data) => {
            const el = document.getElementById(data.msg_id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 200);
            }
        });
    </script>
</body>
</html>
