<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NOPROF</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
            --text: #ededed;
            --text-dim: #737373;
        }
        [data-theme="light"] {
            --bg: #f4f4f5;
            --surface: #ffffff;
            --border: #e4e4e7;
            --text: #09090b;
            --text-dim: #71717a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        .hidden { display: none !important; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; gap: 15px; }
        input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 4px; outline: none; font-family: monospace; width: 240px; text-align: center; }
        button { background: var(--text); color: var(--bg); border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; }
        button:hover { opacity: 0.8; }

        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 10; }
        .control-btn { cursor: pointer; font-size: 16px; background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; }

        #app-screen { display: flex; width: 100%; height: 100%; position: relative; }
        .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; gap: 15px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { background: var(--surface); border: 1px solid var(--border); padding: 10px; border-radius: 4px; max-width: 60%; word-break: break-all; font-size: 13px; }
        .message b { color: var(--text-dim); margin-right: 8px; }

        .input-box { display: flex; padding: 15px; background: var(--surface); border-top: 1px solid var(--border); gap: 10px; }
        .input-box input { flex: 1; text-align: left; }

        .friend-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .friend-item { font-size: 13px; color: var(--text-dim); padding: 6px 8px; border-radius: 4px; cursor: pointer; }
        .friend-item:hover, .friend-item.active { background: var(--border); color: var(--text); }

        .settings-area { margin-top: auto; }
        .danger-btn { background: transparent; border: 1px solid #330000; color: #ff4444; width: 100%; padding: 8px; }
    </style>
</head>
<body data-theme="dark">

    <div class="top-controls">
        <div class="control-btn" id="theme-btn" onclick="toggleTheme()">🌙</div>
        <div class="control-btn" id="lang-btn" onclick="toggleLang()">🇹🇷</div>
    </div>

    <div id="login-screen">
        <h2 id="txt-title" style="letter-spacing: 2px;">NOPROF</h2>
        <input type="text" id="username-input" placeholder="kullanıcı adı...">
        <button id="txt-login-btn" onclick="login()">GİRİŞ</button>
    </div>

    <div id="app-screen" class="hidden">
        <div class="sidebar">
            <h3 id="txt-friends-title" style="font-size: 12px; color: var(--text-dim);">ARKADAŞLAR</h3>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="friend-input" placeholder="ekle..." style="width: 100%; padding: 8px; font-size: 12px;">
                <button onclick="addFriend()" style="padding: 8px 12px; font-size: 12px;">+</button>
            </div>
            <div class="friend-list" id="friend-box"></div>

            <div class="settings-area">
                <button class="danger-btn" id="txt-reset-btn" onclick="resetAccount()">HESABI SİL</button>
            </div>
        </div>

        <div class="chat-area">
            <div id="chat-box" style="display: flex; align-items: center; justify-content: center; color: var(--text-dim);">Bir arkadaş seç ve sohbet etmeye başla.</div>
            <div class="input-box hidden" id="msg-container">
                <input type="text" id="msg-input" placeholder="mesaj yaz..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="txt-send-btn" onclick="sendMessage()">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('noprof_user');
        let currentLang = 'tr';
        let currentTheme = 'dark';
        let activeChat = null;
        let messageInterval = null;

        const texts = {
            tr: { loginBtn: "GİRİŞ", usernamePlaceholder: "kullanıcı adı...", friendsTitle: "ARKADAŞLAR", friendPlaceholder: "ekle...", resetBtn: "HESABI SİL", sendBtn: "GÖNDER", msgPlaceholder: "mesaj yaz..." },
            en: { loginBtn: "LOGIN", usernamePlaceholder: "username...", friendsTitle: "FRIENDS", friendPlaceholder: "add...", resetBtn: "DELETE ACCOUNT", sendBtn: "SEND", msgPlaceholder: "type a message..." }
        };

        function toggleLang() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            document.getElementById('lang-btn').innerText = currentLang === 'tr' ? '🇹🇷' : '🇬🇧';
            updateTexts();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-btn').innerText = currentTheme === 'dark' ? '🌙' : '☀️';
        }

        function updateTexts() {
            const t = texts[currentLang];
            document.getElementById('txt-login-btn').innerText = t.loginBtn;
            document.getElementById('username-input').placeholder = t.usernamePlaceholder;
            document.getElementById('txt-friends-title').innerText = t.friendsTitle;
            document.getElementById('friend-input').placeholder = t.friendPlaceholder;
            document.getElementById('txt-reset-btn').innerText = t.resetBtn;
            document.getElementById('txt-send-btn').innerText = t.sendBtn;
            document.getElementById('msg-input').placeholder = t.msgPlaceholder;
        }

        if(currentUser) { showApp(); }

        function login() {
            const username = document.getElementById('username-input').value.trim();
            if(!username) return;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    localStorage.setItem('noprof_user', data.username);
                    currentUser = data.username;
                    showApp();
                }
            });
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadFriends();
            setInterval(loadFriends, 4000);
        }

        function selectChat(username) {
            activeChat = username;
            document.getElementById('msg-container').classList.remove('hidden');
            
            // Aktif sınıfını güncelle
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            loadMessages();
            if(messageInterval) clearInterval(messageInterval);
            messageInterval = setInterval(loadMessages, 2000);
        }

        function sendMessage() {
            const message = document.getElementById('msg-input').value.trim();
            if(!message || !activeChat) return;

            document.getElementById('msg-input').value = '';

            fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, friend_username: activeChat, message})
            }).then(() => {
                loadMessages();
            });
        }

        function loadMessages() {
            if(!activeChat) return;
            fetch(`/api/messages?username=${currentUser}&friend_username=${activeChat}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const box = document.getElementById('chat-box');
                    if(data.messages.length === 0) {
                        box.innerHTML = `<div style="color: var(--text-dim); text-align:center;">Henüz mesaj yok. İlk mesajı sen yaz!</div>`;
                        return;
                    }
                    box.innerHTML = data.messages.map(m => `<div class="message"><b>${m.username}:</b> ${m.message}</div>`).join('');
                    box.scrollTop = box.scrollHeight;
                }
            });
        }

        function addFriend() {
            const friend_username = document.getElementById('friend-input').value.trim();
            if(!friend_username) return;

            fetch('/api/friends', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, friend_username})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('friend-input').value = '';
                    loadFriends();
                } else {
                    alert(data.error || "Kullanıcı eklenemedi.");
                }
            });
        }

        function loadFriends() {
            fetch(`/api/friends?username=${currentUser}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const box = document.getElementById('friend-box');
                    if(data.friends.length === 0) {
                        box.innerHTML = `<div style="font-size:12px; color:var(--text-dim);">Henüz arkadaş yok.</div>`;
                        return;
                    }
                    box.innerHTML = data.friends.map(f => `<div class="friend-item ${activeChat === f ? 'active' : ''}" onclick="selectChat('${f}')">@${f}</div>`).join('');
                }
            });
        }

        function resetAccount() {
            if(!confirm("Emin misin?")) return;
            fetch('/api/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser})
            }).then(() => {
                localStorage.removeItem('noprof_user');
                location.reload();
            });
        }
    </script>
</body>
</html>
