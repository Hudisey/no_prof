<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NOPROF | SOHBET</title>
    <style>
        :root { --bg: #000; --surface: #111; --border: #222; --text: #eee; --accent: #333; }
        body { background: var(--bg); color: var(--text); font-family: monospace; height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; }
        .msg-input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        
        /* Dropdown */
        #requests-dropdown { position: absolute; top: 120px; left: 15px; width: 270px; background: #000; border: 1px solid var(--border); padding: 10px; z-index: 100; }
        .req-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
        
        input, button { background: var(--accent); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- GİRİŞ -->
    <div id="login-screen" style="margin: auto; display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="username-input" placeholder="Kullanıcı Adı">
        <button onclick="login()">GİRİŞ YAP</button>
    </div>

    <!-- ANA EKRAN -->
    <div id="app-screen" class="hidden" style="display: flex; width: 100%;">
        <div class="sidebar">
            <h3>SOHBETLER</h3>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="friend-input" placeholder="Arkadaş Ekle...">
                <button onclick="sendFriendRequest()">+</button>
                <button onclick="toggleRequests()">🔔</button>
            </div>
            
            <!-- İstekler Kutusu -->
            <div id="requests-dropdown" class="hidden">
                <div style="font-size: 10px; color: #888;">GELEN İSTEKLER</div>
                <div id="requests-list"></div>
            </div>

            <div id="friend-box"></div>
        </div>

        <div class="chat-main">
            <div id="chat-box"></div>
            <div class="msg-input-area">
                <input type="text" id="msg-input" style="flex:1" placeholder="Mesaj...">
                <button onclick="sendMessage()">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('noprof_user');
        let activeChat = null;

        function login() {
            currentUser = document.getElementById('username-input').value;
            localStorage.setItem('noprof_user', currentUser);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadData();
        }

        function toggleRequests() {
            document.getElementById('requests-dropdown').classList.toggle('hidden');
        }

        // İstek listesini ve arkadaşları çeken ana fonksiyon
        async function loadData() {
            // 1. İstekleri Çek
            const reqRes = await fetch(`/api/friend-request?username=${currentUser}`);
            const reqData = await reqRes.json();
            const reqList = document.getElementById('requests-list');
            
            if (reqData.pending && reqData.pending.length > 0) {
                reqList.innerHTML = reqData.pending.map(p => `
                    <div class="req-item">
                        <span>${p.username}</span>
                        <button onclick="respondRequest('${p.username}', 'accept')">✓</button>
                    </div>
                `).join('');
            } else {
                reqList.innerHTML = '<div style="font-size:10px; color:#555;">İstek yok.</div>';
            }

            // 2. Arkadaş/Grup Listesini Çek (Burayı kendi API yapına göre doldur)
            // ... loadSidebar kodların buraya gelecek ...
        }

        function sendFriendRequest() {
            const target = document.getElementById('friend-input').value;
            fetch('/api/friend-request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, friend_username: target})
            }).then(() => { alert("İstek gitti!"); loadData(); });
        }

        function respondRequest(friend, action) {
            fetch('/api/friend-action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, friend_username: friend, action})
            }).then(() => loadData());
        }

        function sendMessage() {
            const msg = document.getElementById('msg-input').value;
            if(!activeChat) return alert("Sohbet seç!");
            fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, receiver: activeChat, message: msg})
            }).then(() => document.getElementById('msg-input').value = '');
        }

        // Başlangıç kontrolü
        if(currentUser) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadData();
            setInterval(loadData, 5000);
        }
    </script>
</body>
</html>
